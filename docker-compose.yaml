version: '3.8'

services:
  # Chat DB
  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  # Websockets DB
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
volumes:
  mongo-data:
